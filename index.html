<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="game-revision" content="20261119-character-performance">
<meta name="theme-color" content="#130f16">
<meta name="description" content="《长安未明》是一部双线宫廷悬疑冒险。阿沅从子时的雨夜醒来，凭一枚锈钥和一行血字找回三年前的真相。">
<title>长安未明</title>
<style>:root {
  color-scheme: dark;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif;
  --gold: #edc98c;
  --cream: #fff1d5;
  --muted: #baa88f;
  --line: #c99d6447;
  background: #100d13;
  color: #f4e7d5;
}
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .36; }
button:focus-visible { outline: 2px solid #ffe3af; outline-offset: 3px; }
[hidden] { display:none !important; }
#game {
  isolation: isolate; position: relative; display: grid;
  grid-template-rows: auto 1fr; min-height: 100vh; min-height: 100svh;
  --accent: #edc98c; --panel: 25, 18, 21; --alt: 19, 14, 25;
}
#game[data-mode="romance"] { --accent:#ffddd9; --panel: 49, 28, 46; --alt: 42, 28, 55; --line:#e7b2bf66; }
#game[data-mode="hd"] { --accent:#cef2f5; --panel: 12, 24, 30; --alt: 15, 20, 25; --line:#a5cfcd57; }
#stage, .engraving { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#stage { z-index:-2; background:radial-gradient(ellipse at 63% 36%, #4b2823, #14101b 50%, #09070d 92%); }
#game[data-mode="hd"] #stage { background:var(--corridor) center / cover #211915; }
#game[data-mode="hd"] #world:not([data-plate="ready"]) { visibility:hidden; }
#game[data-mode="hd"] #world[data-plate="ready"] + #paint .paint-layer[data-art="corridor"].is-current { opacity:0; }
#world, #paint, #portraits, #effects, .paint-layer, .vignette, .scanlines, .scene-cut { position:absolute; inset:0; width:100%; height:100%; }
#world { transition: filter 450ms, opacity 500ms; }
#world canvas { display:block; width:100%; height:100%; }
#paint { overflow:hidden; }
.paint-layer {
  background-repeat:no-repeat; background-size:cover; background-position:center 36%;
  opacity:0; transition:opacity .48s ease; transform:scale(1.014); will-change:opacity;
}
.paint-layer.is-current { opacity:var(--art-opacity, 1); }
.paint-layer.is-current:not([data-art$="Pixel"]) { animation: camera-breathe 18s ease-out both; }
@keyframes camera-breathe { from { transform:scale(1.014); } to { transform:scale(1.065); } }
.paint-layer[data-art="title"] { background-position: center 35%; }
.paint-layer[data-art="guard"] {
  background-position: 57% 35%; background-size:auto 100%;
  mask-image:linear-gradient(90deg, transparent 15%, #000 44%, #000 83%, transparent 100%);
}
.paint-layer[data-art="romance"], .paint-layer[data-art="tea"] { background-position: 64% 35%; }
.paint-layer[data-art="duel"] { background-position: center 36%; }
.paint-layer[data-art="pixel"], .paint-layer[data-art="nightmare"], .paint-layer[data-art$="Pixel"] { image-rendering:pixelated; }
[data-mode="hd"][data-turn="7"] .paint-layer[data-art="duel"] {
  mask-image:linear-gradient(90deg,transparent 1%,#000 24%,#000 80%,transparent 100%);
}
[data-mode="hd"][data-turn="10"] .paint-layer[data-art="duel"] { background-position: center 25%; }
[data-mode="hd"][data-turn="11"] .paint-layer[data-art="duel"] { background-position: center 58%; }
[data-mode="hd"][data-turn="12"] .paint-layer[data-art="duel"] { background-position: center 18%; }
#game[data-mode="romance"] #world, #game[data-mode="romance"] #paint { filter:contrast(1.15) brightness(1.1) saturate(1.3); }
#portraits { transition:opacity .4s; }
#game[data-pictured="true"] #portraits { opacity:0; }
.vignette {
  background:
    linear-gradient(180deg, #08060cd6, transparent 17%, transparent 44%, #09070cd9 91%),
    radial-gradient(ellipse at 62% 43%, transparent 20%, #0b070e33 56%, #08060c8c 100%);
}
[data-screen="title"] .vignette {
  background:linear-gradient(90deg,#110b12f5 0%,#160b14e0 18%,#160c148c 40%,#160b1409 67%),
    linear-gradient(0deg,#09070ee6,transparent 27%,transparent 75%,#0b0711bf);
}
[data-mode="romance"]:not([data-screen="title"]) .vignette {
  background:linear-gradient(180deg,#1f1325a1,transparent 17%,transparent 43%,#180e24cd 96%),
    radial-gradient(ellipse at 62% 33%, transparent 30%, #28152c44 100%);
}
#game[data-sanity="1"]:not([data-screen="title"]) .vignette,
#game[data-sanity="0"]:not([data-screen="title"]) .vignette { box-shadow:inset 0 0 150px 22px #700b2b95; }
.scanlines { opacity:0; background:repeating-linear-gradient(0deg,#0c091533 0px,#0c091533 1px,transparent 2px,transparent 4px); }
[data-mode="pixel"]:not([data-screen="title"]) .scanlines { opacity:.47; }
.scene-cut { opacity:0; background:#170f20; }
.scene-cut.cut { animation:cut .68s ease-out; }
@keyframes cut { from { opacity:.72; } to { opacity:0; } }
.engraving { z-index:-1; inset:10px; border:1px solid #dbb77b36; }
.engraving i { position:absolute; width:35px; height:35px; border:2px double #e4b778a3; }
.engraving i:nth-child(1){ top:0; left:0; border-right:0; border-bottom:0; }
.engraving i:nth-child(2){ top:0; right:0; border-left:0; border-bottom:0; }
.engraving i:nth-child(3){ bottom:0; left:0; border-right:0; border-top:0; }
.engraving i:nth-child(4){ bottom:0; right:0; border-left:0; border-top:0; }
.top {
  display:grid; grid-template-columns: minmax(118px,1fr) auto minmax(223px,1fr);
  align-items:center; gap:18px; padding:23px clamp(25px,4vw,65px) 14px;
}
.wordmark {
  display:flex; align-items:center; gap:11px; justify-self:start; padding:0; background:none; border:0;
  text-align:left; font:700 17px/1.05 var(--serif); letter-spacing:.14em; color:#f6dbab;
}
.wordmark:hover { color:#fff5de; }
.wordmark small { display:block; margin-top:5px; font:400 9px/1.1 "Microsoft YaHei",sans-serif; letter-spacing:.47em; color:#dab98a; }
.seal-small { display:grid; place-items:center; width:33px; height:35px; border:3px double #e3b98a; color:#ffe3b3; background:#751d29b5; font-size:20px; letter-spacing:0; }
.hud {
  display:flex; gap:19px; align-items:center;padding:7px 15px; min-height:51px;
  border:1px solid var(--line); background:#100b12ba; backdrop-filter:blur(11px);
  box-shadow:inset 0 1px #f5ce9512, 0 6px 28px #0003;
}
[data-screen="title"] .hud { visibility:hidden; }
.clock { display:grid; gap:4px; min-width:85px; }
.clock strong { font:600 21px/1 Georgia,serif; color:#ffdfa6; white-space:nowrap; }
.clock small { font-size:11px; color:#b4a08c; }
#marks { display:grid; grid-template-columns:repeat(12,1fr); gap:2px; }
#marks i { height:2px; background:#c9a48243; }
#marks i.on { background:#dcad72; }
#marks i.current { background:#fff2c7; box-shadow:0 0 8px #ffd68cae; }
.meter { display:grid; gap:4px; }
.meter > span,.pocket > span { white-space:nowrap; color:#dac3a2; font-size:10px; letter-spacing:.17em; }
.pips { display:flex; align-items:center; gap:4px; height:11px; }
.pips i { display:block; width:8px; height:8px; transform:rotate(45deg) scale(.85); border:1px solid #b39a8d76; }
.pips.san i.on { border-color:#b7e0d8; background:#9dccbf; box-shadow:0 0 8px #77c5bb7d; }
.pips.love i.on { border-color:#f9a28b; background:#d87969; box-shadow:0 0 8px #cf6c6782; }
.pocket { display:grid; gap:2px; padding:0 0 0 12px; background:none; border:0; border-left:1px solid var(--line); text-align:left; }
.pocket strong { font-size:11px; font-weight:500; color:#f4dbb1; white-space:nowrap; }
.pocket:hover strong { text-decoration:underline; }
.controls { display:flex; align-items:center; gap:8px; justify-self:end; }
.styles { display:flex; padding:3px; border:1px solid var(--line); background:#110c15bd; gap:2px; }
.styles button { border:0; padding:6px 11px; background:none; font-size:12px; white-space:nowrap; color:#d6c9b6; }
.styles button[aria-pressed="true"] { color:#25171a; font-weight:700; background:linear-gradient(135deg,#ffe1a9,#bd8a60); }
.styles button:not([aria-pressed="true"]):hover { color:#fff0cc; background:#dba3772b; }
.icon-button { display:grid; place-items:center; padding:0; width:37px; height:36px; border:1px solid var(--line); background:#120e16bc; color:#f6d6a4; }
.icon-button:hover { background:#4e2f35; }
.sound svg { width:21px; height:21px; }
.sound .sound-off, .sound[aria-pressed="true"] .sound-wave { display:none; }
.sound[aria-pressed="true"] .sound-off { display:inline; }
#title-screen { position:relative; display:grid; align-content:center; padding:32px clamp(38px,9vw,160px) 88px; min-height:590px; }
.title-copy { width:max-content; max-width:100%; text-shadow:0 3px 24px #100810; padding-bottom:min(4vh,38px); }
.title-kicker { display:flex; align-items:center; gap:9px; margin-bottom:19px; font-size:12px; letter-spacing:.27em; color:#f0cc99; }
.title-kicker span { width:9px; height:9px; background:#9b353b; border:1px solid #e9bc82; transform:rotate(45deg); }
h1 { margin:0 0 2px -.04em; font:700 clamp(58px,8.8vw,145px)/.98 var(--serif); letter-spacing:.037em; color:#f9daa4;
  background:linear-gradient(#ffedc5,#edcb8d 42%,#b5804d); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none; filter:drop-shadow(2px 5px 9px #08040ab3); }
.title-sub { display:flex; align-items:center; gap:14px; margin-top:15px; font:600 clamp(19px,2.3vw,36px)/1 var(--serif); letter-spacing:.34em; color:#f0ce9b; }
.title-sub i { width:30px; height:1px; background:#c89665; }
.title-sub i:nth-of-type(2) { width:64px; background:linear-gradient(90deg,#c89665,transparent); }
.stamp { font:700 10px/1.16 var(--serif); letter-spacing:.04em; transform:rotate(-8deg); border:3px double #e6b285; padding:4px; background:#801a2be5; color:#f9d7b4; }
.title-hook { font:500 clamp(15px,1.6vw,21px)/1.82 var(--serif); color:#f0e1cd; margin:30px 0 28px; letter-spacing:.115em; }
.title-menu { display:grid; align-items:start; justify-items:start; gap:8px; }
.title-menu > button { display:flex; align-items:center; justify-content:space-between; width:235px; min-height:44px; padding:9px 15px; border:1px solid #ab775e81; background:#2b181aba; }
.title-menu > button.primary {
  background:linear-gradient(115deg,#8b303a,#4c1726 90%); border:1px solid #dbac75; color:#ffe8bd;
  box-shadow:0 0 0 3px #18111a,0 0 0 4px #b68b6155,inset 0 1px #f9d69251,0 9px 27px #0005;
  font:700 19px/1.4 var(--serif); letter-spacing:.17em;
}
.title-menu > button:hover { background:linear-gradient(115deg,#ad4650,#641e31); }
.title-secondary { display:flex; gap:15px; margin-top:9px; flex-wrap:wrap; }
.title-secondary button, .play-toolbar button { padding:6px 2px; border:0; background:none; color:#e4d2b8; font-size:12px; }
.title-secondary button:hover, .play-toolbar button:not(:disabled):hover { color:#fff0c6; text-decoration:underline; text-underline-offset:4px; }
.title-footer { display:flex; position:absolute; left:clamp(26px,4vw,65px); right:clamp(26px,4vw,65px); bottom:25px; justify-content:space-between; gap:9px; color:#d7bda3; letter-spacing:.11em; font-size:10px; }
#play-screen { display:grid; align-content:space-between; min-width:0; gap:15px; padding:0 clamp(24px,4vw,66px) 19px; }
.scene-meta { padding-top:clamp(23px,5vh,69px); text-shadow:0 2px 7px #07050c,0 0 22px #020107; justify-self:start; }
.scene-meta > div { display:flex; gap:9px; align-items:center; font:600 11px/1.6 "Microsoft YaHei",sans-serif; letter-spacing:.15em; color:var(--accent); }
.scene-meta i { width:13px; height:1px; display:inline-block; background:var(--accent); opacity:.6; }
.scene-meta h2 { font:700 clamp(28px,4.3vw,64px)/1.2 var(--serif); letter-spacing:.06em; margin:5px 0 0; color:#fff2d8; }
.scene-meta h2:focus { outline:none; }
.cast-tag {
  justify-self:end; align-self:end; margin-right:2vw; padding:5px 11px; border-right:2px double var(--accent);
  text-align:right; color:var(--accent); font:700 14px/1.6 var(--serif); letter-spacing:.18em; text-shadow:0 1px 12px #000;
  background:linear-gradient(90deg,transparent,#17101bc4);
}
.play-bottom { align-self:end; width:min(100%,1450px); justify-self:center; }
.dialogue {
  position:relative; border:1px solid var(--line);
  padding:16px clamp(16px,2.2vw,34px) 20px;
  background:linear-gradient(122deg,rgba(var(--panel),.975),rgba(var(--alt),.9));
  box-shadow:0 0 0 4px #100c1399,0 0 0 5px #c3ab7e2b,0 15px 55px #0008;
  backdrop-filter:blur(10px);
}
[data-mode="romance"] .dialogue { border-radius:16px 0 16px 0; border-color:#fbd0d799; box-shadow:0 0 0 4px #f8bec81f,inset 0 0 24px #e3a9cf15,0 15px 55px #0008; }
[data-mode="hd"] .dialogue { border-left:3px solid #84b2b7; }
.dialogue:before, .dialogue:after { content:""; position:absolute; width:25px; height:2px; top:-1px; background:var(--accent); opacity:.85; pointer-events:none; }
.dialogue:before { left:0; } .dialogue:after { right:0; }
.dialogue-top { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding-bottom:9px; margin-bottom:11px; }
.speaker { color:var(--accent); font:700 17px/1.2 var(--serif); letter-spacing:.12em; }
.speaker > span { font-size:9px; vertical-align:2px; margin-right:4px; }
.score { color:#e0c9aa; font-size:11px; letter-spacing:.08em; text-align:right; }
.score > span:first-child { color:var(--accent); }
.dialogue-grid { display:grid; grid-template-columns:minmax(0,1.85fr) minmax(262px,1fr); gap:clamp(20px,2.5vw,42px); align-items:center; }
[data-mode="romance"] .dialogue-grid { grid-template-columns:minmax(0,1.52fr) minmax(250px,1fr); }
.reading { min-width:0; }
.frame { color:#e3c39e; font:500 12px/1.6 "Microsoft YaHei",sans-serif; letter-spacing:.03em; margin:0 0 7px; }
.echo { color:#dbc7d0; border-left:2px solid var(--line); padding-left:8px; font:400 12px/1.5 "Microsoft YaHei",sans-serif; margin:0 0 7px; }
.prose { font:400 clamp(15px,1.18vw,18px)/1.73 "Microsoft YaHei","PingFang SC",sans-serif; letter-spacing:.03em; }
.enlarged .prose { font-size:clamp(17px,1.38vw,22px); }
.prose p { margin:0 0 .39em; }
.prose p:last-child { margin:0; }
[data-mode="romance"] .prose p { padding-left:10px; border-left:1px solid #dbc0d337; }
[data-mode="romance"] .prose p:nth-child(2n) { border-color:#f5c5cf9a; color:#ffe1e4; }
.epilogue { color:var(--accent); letter-spacing:.1em; font:600 15px/1.7 var(--serif); margin-bottom:0; }
.choices { display:grid; align-items:stretch; gap:7px; }
.choice {
  display:grid; grid-template-columns:29px minmax(0,1fr) 12px; align-items:center; gap:11px; text-align:left;
  min-height:45px; padding:7px 11px; border:1px solid var(--line); color:#fff0de;
  background:linear-gradient(120deg,#b0837824,#09071062);
  transition:background .2s,border-color .2s,transform .2s;
}
.choice:hover, .choice:focus-visible { border-color:var(--accent); background:linear-gradient(120deg,#a4685675,#40292a82); transform:translateX(3px); }
[data-mode="romance"] .choice { border-radius:7px; background:linear-gradient(120deg,#ad658354,#37234f88); }
[data-mode="hd"] .choice:hover { background:linear-gradient(120deg,#315661b5,#122b37a8); }
.choice .letter { display:grid; width:25px; height:25px; place-items:center; border:1px solid var(--line); color:var(--accent); font:600 14px Georgia,serif; }
.choice .label { font:700 15px/1.38 var(--serif); letter-spacing:.035em; }
.choice .detail { display:block; color:#e0cbb7; font:400 11px/1.35 "Microsoft YaHei",sans-serif; margin-top:2px; }
.choice .chevron { color:var(--accent); font:400 18px/1 Georgia,serif; }
.play-toolbar { display:flex; gap:10px; justify-content:space-between; margin-top:11px; }
.play-toolbar > div { display:flex; flex-wrap:wrap; align-items:center; gap:15px; }
.view-only .hud, .view-only .scene-meta, .view-only .cast-tag, .view-only .dialogue, .view-only .play-toolbar button:not(#cinema) { visibility:hidden; }
.view-only .vignette { opacity:.48; }
#panel {
  width:min(540px,calc(100% - 38px)); max-height:min(620px,84dvh); overflow:auto;
  padding:20px 22px 24px; background:linear-gradient(141deg,#291925,#130e17);
  color:#f5e4cb; border:1px solid #ca9b6e9c; box-shadow:0 0 0 5px #0006,0 20px 70px #0009;
}
#panel::backdrop { background:#0d0810bb; backdrop-filter:blur(5px); }
.modal-top { display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:1px solid var(--line); margin-bottom:13px; padding-bottom:9px; }
.modal-top h2 { margin:0; color:#ffe0ab; font:700 25px/1.1 var(--serif); }
.modal-top .icon-button { font:24px/1 Georgia,serif; }
.panel-row { border:1px solid var(--line); padding:11px 12px; margin-top:8px; display:flex; align-items:center; gap:10px; justify-content:space-between; }
.panel-row strong { font-weight:600; }
.panel-row small,.panel-copy { display:block; margin:5px 0; color:#d9c2a6; font-size:12px; line-height:1.6; }
.panel-row .row-actions { display:flex; gap:6px; align-items:center; }
.panel-row button { white-space:nowrap; border:1px solid var(--line); background:#4c2c35; padding:6px 9px; font-size:12px; }
.panel-row button:not(:disabled):hover { border-color:#ffcd95; }
.log-entry { padding:11px 0; border-bottom:1px solid var(--line); }
.log-entry h3 { margin:0 0 5px; color:#ffdc9e; font:700 17px/1.4 var(--serif); }
.log-entry p { font:500 14px/1.65 var(--serif); margin:4px 0; }
.log-entry small { color:#eeac9b; }
#toast { position:fixed; right:30px; bottom:54px; z-index:3; pointer-events:none; background:#1a101ae8; border:1px solid var(--line); padding:9px 14px; font-size:13px; color:#ffe3b9; opacity:0; transition:opacity .2s; }
#toast.visible { opacity:1; }
.no-js { position:fixed; bottom:24px; left:23px; background:#631728; padding:10px; }
[data-screen="ending"] .dialogue { --accent:#ffe29f; }
[data-ending="BE"] .dialogue { --accent:#ffaca6; }
[data-ending="HE"] .dialogue { --accent:#ffcfef; }
@media (max-width:1050px) {
  .top { gap:12px; padding-inline:24px; grid-template-columns:auto 1fr auto; }
  .hud { gap:12px; justify-self:center; }
  .pocket strong { max-width:125px; white-space:normal; }
  .styles button { padding:6px 7px; }
  .title-copy { max-width:66vw; }
}
@media (max-height:790px) and (min-width:751px) {
  #title-screen { min-height:510px; padding-bottom:58px; }
  .scene-meta { padding-top:18px; }
  #play-screen { gap:11px; }
  .cast-tag { margin-bottom:0; }
}
@media (max-width:750px) {
  .top { grid-template-columns:1fr auto; gap:9px; padding:17px 19px 4px; }
  .controls { grid-column:2; grid-row:1; }
  .hud { width:100%; grid-column:1/-1; grid-row:2; justify-content:space-between; gap:6px; padding:6px 9px; min-height:44px; }
  [data-screen="title"] .hud { display:none; }
  .pocket { padding-left:6px; }
  .pocket strong { font-size:10px; max-width:110px; }
  .clock { min-width:63px; }
  .clock strong { font-size:17px; }
  .pips { gap:2px; }.pips i { width:7px; height:7px; }
  .wordmark { font-size:13px; gap:8px; white-space:nowrap; }
  .wordmark small { font-size:8px; }
  .seal-small { width:26px; height:28px; font-size:16px; }
  .styles button { font-size:11px; }
  .sound { width:29px;height:31px; }
  .sound svg { width:18px; height:18px; }
  #title-screen { min-height:calc(100svh - 53px); align-content:end; padding:115px 27px 76px; }
  .title-copy{ max-width:100%; padding-bottom:0; }
  .title-kicker { font-size:10px; margin-bottom:13px; }
  h1 { font-size:clamp(51px,12vw,82px); }
  .title-hook { margin:20px 0 21px; }
  .title-footer { bottom:20px; left:24px; right:24px; font-size:9px; }
  .paint-layer[data-art="title"] { background-position:62% 26%; }
  [data-screen="title"] .vignette { background:linear-gradient(0deg,#100914fa 4%,#170d17e8 27%,#150b175c 59%,#170b1724 79%,#09050eaa); }
  .paint-layer[data-art="guard"] { background-position:57% 10%; background-size:auto 80%; mask-image:linear-gradient(180deg,#000 0%,#000 42%,transparent 71%); }
  .paint-layer[data-art="romance"], .paint-layer[data-art="tea"] { background-position:64% 7%; background-size:auto 81%; }
  #play-screen { padding:0 19px 17px; gap:12px; }
  .scene-meta { padding-top:15px; }
  .scene-meta > div { font-size:10px; }
  .scene-meta h2 { font-size:31px; }

/* Shared controls. Style modes change finish and accents while retaining placement and behavior. */
#game {
  --ui-ink:#10191d;
  --ui-raised:#243337;
  --ui-paper:#fff0d9;
  --ui-muted:#d8c2b1;
  --ui-metal:#ccac80;
  --ui-metal-rgb:204,172,128;
  --ui-signal:#ffdc98;
  --ui-signal-rgb:255,220,152;
  --ui-cloth:#783747;
  --ui-cut:2px;
  --ui-focus:#ffe8b1;
}
#game[data-mode="pixel"] {
  --ui-ink:#17171a;
  --ui-raised:#302627;
  --ui-metal:#c39766;
  --ui-metal-rgb:195,151,102;
  --ui-signal:#ffd496;
  --ui-signal-rgb:255,212,150;
  --ui-cloth:#6d3248;
  --ui-cut:0;
}
#game[data-mode="romance"] {
  --ui-ink:#111a1e;
  --ui-raised:#263439;
  --ui-metal:#d9b793;
  --ui-metal-rgb:217,183,147;
  --ui-signal:#f6debc;
  --ui-signal-rgb:246,222,188;
  --ui-cloth:#455956;
  --ui-cut:10px;
}
#game[data-ending="BE"] { --ui-signal:#ffa2ae; --ui-signal-rgb:255,162,174; }
#game[data-ending="HE"] { --ui-signal:#f8d9ec; --ui-signal-rgb:248,217,236; }

#game :is(button,a,input):focus-visible {
  outline:2px solid var(--ui-focus);
  outline-offset:3px;
}
.top { position:relative; z-index:6; pointer-events:none; }
.top :is(button,.hud,.controls) { pointer-events:auto; }
#game[data-screen="title"] .top { z-index:6; }
.hud,.styles,.sound {
  border-color:rgba(var(--ui-metal-rgb),.43);
  background:linear-gradient(117deg,var(--ui-raised),var(--ui-ink) 85%);
  box-shadow:inset 0 0 0 2px #100912a1,0 8px 24px #07050d65;
}
.hud { max-width:min(100%,680px); }
.hud .clock strong { color:var(--ui-signal); }
.hud .meter > span,.hud .pocket > span { color:var(--ui-muted); }
.styles button[aria-pressed="true"] {
  background:linear-gradient(143deg,var(--ui-paper),var(--ui-metal));
  color:#261622;
  border-radius:var(--ui-cut);
}
#game .dialogue,#panel {
  border:1px solid rgba(var(--ui-metal-rgb),.58);
  border-radius:var(--ui-cut);
  background:
    radial-gradient(ellipse at 17% 0%,rgba(var(--ui-signal-rgb),.075),transparent 64%),
    linear-gradient(114deg,color-mix(in srgb,var(--ui-raised) 69%,#101518 31%) 0%,var(--ui-ink) 42%,#12171a 100%);
  color:var(--ui-paper);

const VOICE_MAP={"free":{"1":[{"speaker":"pei","tone":"urgent","text":"把铜钥给我。跟我走，今夜就得出宫。","file":"speech/free-1-01.mp3"},{"speaker":"pei","tone":"guarded","text":"别往左。那块石阶生了苔，你摔过。","file":"speech/free-1-02.mp3"}],"2":[{"speaker":"li","tone":"gentle","text":"阿沅，我把近处的灯都点了。你想坐哪儿就坐哪儿。","file":"speech/free-2-01.mp3"},{"speaker":"li","tone":"gentle","text":"从前你最爱弹错这一声。你若想起来了，还照老样子弹错就好。","file":"speech/free-2-02.mp3"}],"4":[{"speaker":"li","tone":"hushed","text":"你把灯放低一点。","file":"speech/free-4-01.mp3"},{"speaker":"li","tone":"concerned","text":"我想和你好好说话。","file":"speech/free-4-02.mp3"}],"5":[{"speaker":"li","tone":"vulnerable","text":"我刚有耳朵的时候，整间屋只有一个人在哭。","file":"speech/free-5-01.mp3"},{"speaker":"li","tone":"vulnerable","text":"后来我才分得出你的脚步。你在门口站很久，我就弹琴，等你肯进来。","file":"speech/free-5-02.mp3"}],"6":[{"speaker":"li","tone":"cold","text":"你带她走过六次。哪一次她回头时，你敢告诉她你是谁？","file":"speech/free-6-01.mp3"},{"speaker":"pei","tone":"guarded","text":"她看清我，就要把那一夜重新过一遍。","file":"speech/free-6-02.mp3"},{"speaker":"li","tone":"haunted","text":"她给我的第一样东西是一副耳朵。我舍不得听不见她。方才你切断一根，她还活着。你再切，我便没有了。","file":"speech/free-6-03.mp3"}],"8":[{"speaker":"pei","tone":"urgent","text":"我问过了，这把开西偏门。过了门，顺着有灯的地方走。","file":"speech/free-8-01.mp3"}],"9":[{"speaker":"li","tone":"gentle","text":"等天亮就带你走","file":"speech/free-9-01.mp3"},{"speaker":"pei","tone":"urgent","text":"铜钥能开门。我这点魂，还够你挥最后一刀。","file":"speech/free-9-02.mp3"}],"10":[{"speaker":"li","tone":"vulnerable","text":"我刚才还想让你留下。","file":"speech/free-10-01.mp3"},{"speaker":"li","tone":"tender","text":"我现在也想。阿沅，跟你说实话会不会来得太晚？","file":"speech/free-10-02.mp3"}],"11":[{"speaker":"pei","tone":"overlap","text":"阿沅。","file":"speech/free-11-01.mp3","layer":"li"}],"0C":[{"speaker":"pei","tone":"guarded","text":"当心烫","file":"speech/free-0c-01.mp3"}],"1A":[{"speaker":"pei","tone":"tender","text":"扶过你一次。","file":"speech/free-1a-01.mp3"}],"2A":[{"speaker":"li","tone":"concerned","text":"你手边还有一张琴吗？我听见两道声。","file":"speech/free-2a-01.mp3"}],"2B":[{"speaker":"li","tone":"gentle","text":"你亲手刻的，说清早来就认得座位。","file":"speech/free-2b-01.mp3"}],"3B":[{"speaker":"li","tone":"hushed","text":"这里","file":"speech/free-3b-01.mp3"}],"5A":[{"speaker":"li","tone":"urgent","text":"这一声记住，得等到铃尽再拨。","file":"speech/free-5a-01.mp3"}],"5C":[{"speaker":"li","tone":"vulnerable","text":"我会忘了怎么再叫你一声。","file":"speech/free-5c-01.mp3"}],"6B":[{"speaker":"pei","tone":"tender","text":"会。门外若结冰，踩我脚印。","file":"speech/free-6b-01.mp3"}],"6C":[{"speaker":"li","tone":"seductive","text":"你累了就靠我一会儿。","file":"speech/free-6c-01.mp3"}],"9A":[{"speaker":"pei","tone":"tender","text":"那时候你总把凉的让给我。","file":"speech/free-9a-01.mp3"}],"9B":[{"speaker":"pei","tone":"grief","text":"你一认出我，就哭着去开阵。","file":"speech/free-9b-01.mp3"},{"speaker":"pei","tone":"guarded","text":"我得等你亲眼看到它拿走了什么。","file":"speech/free-9b-02.mp3"}],"10A":[{"speaker":"pei","tone":"tender","text":"顺着有灯的地方走。遇见雨，就找户人家借伞。以后没人跟你争那半块冷饼了，你吃热的。","file":"speech/free-10a-01.mp3"}],"TE":[{"speaker":"yuan","tone":"tender","text":"这回……我认得你了。","file":"speech/free-te-01.mp3"},{"speaker":"pei","tone":"tender","text":"好。那就出去吧，阿沅。","file":"speech/free-te-02.mp3"}],"BE":[{"speaker":"li","tone":"haunted","text":"阿沅，这回手怎么一点也不冷？","file":"speech/free-be-01.mp3"}],"HE":[{"speaker":"yuan","tone":"tender","text":"顺着有灯的地方走。","file":"speech/free-he-01.mp3"},{"speaker":"pei","tone":"bright","text":"这次一起。","file":"speech/free-he-02.mp3"}]},"reference":{"0":[{"speaker":"yuan","tone":"afraid","text":"是谁写的……是谁要害我？","file":"speech/reference-0-01.mp3"}],"1":[{"speaker":"pei","tone":"cold","text":"又忘了？把袖里的铜钥拿出来。往玄武门跑。敢回头，我立刻割断你的喉咙。","file":"speech/reference-1-01.mp3"},{"speaker":"yuan","tone":"afraid","text":"你身上全是血……你是画皮鬼！放开我！","file":"speech/reference-1-02.mp3"},{"speaker":"pei","tone":"defiant","text":"闭嘴。谁准你提那三个字？","file":"speech/reference-1-03.mp3"},{"speaker":"pei","tone":"urgent","text":"拿好钥匙，滚出麟德苑。这里没活人待的地方。","file":"speech/reference-1-04.mp3"}],"2":[{"speaker":"li","tone":"gentle","text":"阿沅，你手怎的这样凉？又是那武夫拿刀吓你？来，有孤在，什么妖魔都近不了你的身。","file":"speech/reference-2-01.mp3"},{"speaker":"li","tone":"seductive","text":"孤看不见光，你也记不住事。咱们两个可怜人相依为命，永远留在这暖阁里，不好吗？","file":"speech/reference-2-02.mp3"}],"3":[{"speaker":"li","tone":"seductive","text":"喝了这盏安神汤。睡一觉，明早看见孤，就什么也不怕了。","file":"speech/reference-3-01.mp3"},{"speaker":"pei","tone":"shout","text":"别喝！","file":"speech/reference-3-02.mp3"},{"speaker":"pei","tone":"urgent","text":"死人喝的封魂汤。阿沅，看你自己的手！","file":"speech/reference-3-03.mp3"},{"speaker":"li","tone":"seductive","text":"阿沅，你最听孤的话。是不是？","file":"speech/reference-3-04.mp3"}],"4":[{"speaker":"yuan","tone":"concerned","text":"裴烬叫我拿钥匙出宫……暖阁的锁怎么也是这一把？","file":"speech/reference-4-01.mp3"}],"5":[{"speaker":"li","tone":"hushed","text":"阿沅","file":"speech/reference-5-01.mp3"},{"speaker":"li","tone":"seductive","text":"为什么要开柜子呢？","file":"speech/reference-5-02.mp3"},{"speaker":"li","tone":"puppet","text":"你明明发过誓，忘掉这一夜，孤就能陪你。你既醒了，把你的脸给我补上吧。","file":"speech/reference-5-03.mp3"},{"speaker":"yuan","tone":"afraid","text":"你已经死了。你是……一具画皮傀儡！","file":"speech/reference-5-04.mp3"}],"6":[{"speaker":"pei","tone":"shout","text":"我让你跑！伏低。别碍事。","file":"speech/reference-6-01.mp3"},{"speaker":"li","tone":"cold","text":"郎将连碰她一下都做不到。一缕寄在横刀里的剑意，还当自己是活人？","file":"speech/reference-6-02.mp3"},{"speaker":"li","tone":"haunted","text":"她拿阳寿喂了孤三年。郎将只管砍，她会和孤一起死。","file":"speech/reference-6-03.mp3"},{"speaker":"pei","tone":"urgent","text":"阿沅，木簪。钉住线。","file":"speech/reference-6-04.mp3"}],"7":[{"speaker":"li","tone":"vulnerable","text":"阿沅，回去吧。外头这样冷，孤只有你了。你只要合上眼，孤就能让你什么也不记得。","file":"speech/reference-7-01.mp3"},{"speaker":"pei","tone":"defiant","text":"不准闭眼。","file":"speech/reference-7-02.mp3"},{"speaker":"pei","tone":"grief","text":"睁开眼看看我。我是裴烬，不是什么画皮鬼。","file":"speech/reference-7-03.mp3"}],"8":[{"speaker":"pei","tone":"urgent","text":"拿着。开玄武门。一直走。","file":"speech/reference-8-01.mp3"},{"speaker":"yuan","tone":"grief","text":"真正的画皮鬼……是我自己啊！","file":"speech/reference-8-02.mp3"}],"9":[{"speaker":"pei","tone":"guarded","text":"阵是你设的。只有你的手肯下这一刀，它才肯松手。","file":"speech/reference-9-01.mp3"},{"speaker":"pei","tone":"urgent","text":"刺穿我，刺进它的心。然后拿钥，出玄武门。","file":"speech/reference-9-02.mp3"},{"speaker":"yuan","tone":"afraid","text":"我不刺！你会连最后一缕也不剩！","file":"speech/reference-9-03.mp3"},{"speaker":"pei","tone":"grief","text":"三年前没带你走出玄武门，是我失约。听话，刺进来。让我再护你最后一次。","file":"speech/reference-9-04.mp3"}],"10":[{"speaker":"li","tone":"defiant","text":"你疯了！没有这层幻象，你出去面对的只有冰冷的坟墓！","file":"speech/reference-10-01.mp3"},{"speaker":"li","tone":"vulnerable","text":"阿沅？孤把你的那份饼放在琴边了。你真的一次也不回来吗？","file":"speech/reference-10-02.mp3"}],"11":[{"speaker":"pei","tone":"overlap","text":"阿沅。","file":"speech/reference-11-01.mp3","layer":"li"}],"0C":[{"speaker":"pei","tone":"guarded","text":"阿沅。","file":"speech/reference-0c-01.mp3"}],"1A":[{"speaker":"pei","tone":"guarded","text":"准头还一样。滚！","file":"speech/reference-1a-01.mp3"}],"1C":[{"speaker":"pei","tone":"guarded","text":"别问。沿亮处跑。","file":"speech/reference-1c-01.mp3"},{"speaker":"pei","tone":"urgent","text":"阿沅，别进那扇门！","file":"speech/reference-1c-02.mp3"}],"2A":[{"speaker":"li","tone":"seductive","text":"乖阿沅。","file":"speech/reference-2a-01.mp3"},{"speaker":"li","tone":"haunted","text":"把那柄铜钥扔进炭盆吧，留着它只会招来恶鬼。","file":"speech/reference-2a-02.mp3"}],"2C":[{"speaker":"li","tone":"gentle","text":"你从前总爱弹错这里。错了也好，孤认得。","file":"speech/reference-2c-01.mp3"}],"3A":[{"speaker":"li","tone":"cold","text":"阿沅，你今日怎么这么不听话？","file":"speech/reference-3a-01.mp3"}],"3B":[{"speaker":"li","tone":"haunted","text":"这就对了。孤去偏殿取安魂香。阿沅，千万别碰屏风后面的东西。","file":"speech/reference-3b-01.mp3"}],"3C":[{"speaker":"li","tone":"guarded","text":"孤去取香。别乱动，等我回来。","file":"speech/reference-3c-01.mp3"}],"5B":[{"speaker":"yuan","tone":"shout","text":"裴烬！","file":"speech/reference-5b-01.mp3"}],"5C":[{"speaker":"li","tone":"haunted","text":"李怀玉。","file":"speech/reference-5c-01.mp3"},{"speaker":"li","tone":"cold","text":"你从前叫我殿下，阿沅。再叫一次，孤便原谅你。","file":"speech/reference-5c-02.mp3"}],"6A":[{"speaker":"yuan","tone":"hushed","text":"玄武门。","file":"speech/reference-6a-01.mp3"}],"7B":[{"speaker":"pei","tone":"tender","text":"我在这儿","file":"speech/reference-7b-01.mp3"}],"8B":[{"speaker":"pei","tone":"guarded","text":"扶稳。别跪。","file":"speech/reference-8b-01.mp3"}],"8C":[{"speaker":"pei","tone":"tender","text":"那只手捂了三年伤口。阿沅，张开给我看看。","file":"speech/reference-8c-01.mp3"}],"9A":[{"speaker":"pei","tone":"tender","text":"我听见了。别松手。","file":"speech/reference-9a-01.mp3"}],"10A":[{"speaker":"yuan","tone":"defiant","text":"就算是坟墓，那也是干净的、刻着他裴烬名字的碑！滚出我的记忆！","file":"speech/reference-10a-01.mp3"}],"10B":[{"speaker":"yuan","tone":"tender","text":"裴烬，我记住你了。这一次，就算死我也不会再忘。","file":"speech/reference-10b-01.mp3"}],"TE":[{"speaker":"pei","tone":"tender","text":"做得好，我的小阿沅。","file":"speech/reference-te-01.mp3"},{"speaker":"pei","tone":"grief","text":"阿沅，一直往前走，去长安街上看打铁花，去吃西市的胡饼……替我活下去，岁岁平安。","file":"speech/reference-te-02.mp3"},{"speaker":"yuan","tone":"tender","text":"待百年之后，阿沅去黄泉寻你，换我为你提灯守夜。","file":"speech/reference-te-03.mp3"}],"BE":[{"speaker":"yuan","tone":"haunted","text":"子时到了……殿下，外头风大，阿沅给你煮安神茶好不好？咦……袖袋里怎么有把生锈的钥匙？算了，不重要的人，丢了吧……","file":"speech/reference-be-01.mp3"}],"HE":[{"speaker":"pei","tone":"bright","text":"你这丫头……连阎王爷抢人你都敢截胡？命不要了？！","file":"speech/reference-he-01.mp3"},{"speaker":"yuan","tone":"bright","text":"裴郎将不是说，要押送我出玄武门吗？少一步都不算完差，这辈子，你休想再甩开我！","file":"speech/reference-he-02.mp3"}]}};

    memory:   {bpm: 58, lead: "flute", phrases: partingTheme, chords: intimate, feel: "duet", wet: .29, rain: .026, balance: [.64, .92, .32, .60, .66]},
    farewell: {bpm: 54, lead: "flute", phrases: partingTheme, chords: intimate, feel: "duet", wet: .43, rain: .007, balance: [.62, .93, .22, .63, .41]},
    te:       {bpm: 65, lead: "flute", phrases: firstLight, chords: arrival, feel: "duet", wet: .34, rain: .002, balance: [.65, 1, .18, .70, .30]},
    be:       {bpm: 49, lead: "reed",  phrases: shadow, chords: ominous, feel: "ruin", wet: .50, rain: .034, balance: [.90, .60, .47, .58, .65]},
    he:       {bpm: 74, lead: "flute", phrases: firstLight, chords: arrival, feel: "flight", wet: .41, rain: .002, balance: [.76, 1, .27, .78, .33]},
  };
  scores.reunion = scores.he;

  let context, master, mix, scoreBus, weatherBus, musicBus, musicColor, foley, stormFoley, room, roomLevel, noise, timer, active;
  let musicPlayer = null;
  let sparePlayer = null;
  let reportedEnding = null;
  const retryMusicAt = new Map();
  const rejectedTracks = new Set();
  let scene = "storm";
  let volume = .81;
  let intensity = .3;
  let voiceActive = false;
  let muted = false;
  let lastThunder = -Infinity;
  let lastCharge = -Infinity;
  let opening;
  let disposed = false;
  const retired = new Set();

  function fade(param, value, start, time = .12) {
    param.cancelScheduledValues(start);
    param.setTargetAtTime(value, start, time);
  }

  function gain(destination, level = 1) {
    const node = context.createGain();
    node.gain.value = level;
    if (destination) node.connect(destination);
    return node;
  }

  function panner(destination, position) {
    if (!context.createStereoPanner || Math.abs(position) < .01) return null;
    const stereo = context.createStereoPanner();
    stereo.pan.value = Math.max(-1, Math.min(1, position));
    stereo.connect(destination);
    return stereo;
  }

  function initialize() {
    context = new AudioEngine();
    const compressor = context.createDynamicsCompressor();
    compressor.threshold.value = -16;
    compressor.knee.value = 16;
    compressor.ratio.value = 3;
    compressor.attack.value = .012;
    compressor.release.value = .23;
    compressor.connect(context.destination);
    master = gain(compressor, muted ? 0 : volume * 1.22);
    mix = gain(master);
    scoreBus = gain(mix, voiceActive ? SYNTH_DUCK : 1);
    weatherBus = gain(mix, voiceActive ? .31 : 1);
    const musicLimiter = context.createDynamicsCompressor();
    musicLimiter.threshold.value = -11;
    musicLimiter.knee.value = 10;
    musicLimiter.ratio.value = 2.6;
    musicLimiter.attack.value = .009;
    musicLimiter.release.value = .19;
    musicLimiter.connect(mix);
    musicColor = context.createBiquadFilter();
    musicColor.type = "peaking";
    musicColor.frequency.value = 1850;
    musicColor.Q.value = .64;
    musicColor.gain.value = voiceActive ? MUSIC_DIALOGUE_EQ : 0;
    musicColor.connect(musicLimiter);
    musicBus = gain(musicColor, MUSIC_TRIM * (voiceActive ? MUSIC_DUCK : 1));
    foley = gain(mix, .91);
    stormFoley = gain(mix, voiceActive ? .31 : .86);
    room = context.createConvolver();
    roomLevel = gain(mix, voiceActive ? .11 : .25);
    room.connect(roomLevel);
    const rate = context.sampleRate;
    const impulse = context.createBuffer(2, Math.floor(rate * 2.25), rate);
    for (let channel = 0; channel < 2; channel++) {
      const data = impulse.getChannelData(channel);
      for (let i = 0; i < data.length; i++) {
        const progress = i / data.length;
        data[i] = centered() * Math.min(1, progress * 70) * Math.pow(1 - progress, 3.5);
      }
      for (const [delay, reflection] of [[.030, .53], [.076, -.28], [.123, .21]]) {
        data[Math.floor(rate * (delay + channel * .006))] += reflection;
      }
    }
    room.buffer = impulse;
    noise = context.createBuffer(1, rate * 5, rate);
    const sample = noise.getChannelData(0);
    for (let i = 0; i < sample.length; i++) sample[i] = centered();
  }

  function tone(destination, name, midi, start, duration, strength, pan = 0, wet = 0, wetDestination = room) {
    const patch = patches[name];
    const filter = patch.cut ? context.createBiquadFilter() : null;
    const stage = gain(null, EPSILON);
    const stereo = panner(destination, pan);
    stage.connect(stereo || destination);
    if (filter) {
      filter.type = "lowpass";
      filter.Q.value = name === "bow" ? .68 : .36;
      filter.frequency.setValueAtTime(patch.cut, start);
      if (name === "qin") filter.frequency.exponentialRampToValueAtTime(1100, start + .23);
      if (name === "bow") filter.frequency.linearRampToValueAtTime(1080 + strength * 1100, start + .25);
      filter.connect(stage);
    }
    const send = wet > 0 ? gain(wetDestination, wet) : null;
    if (send) stage.connect(send);
    const echo = patch.chorus ? context.createDelay(.08) : null;
    const echoGain = echo ? gain(destination, .16) : null;
    if (echo) {
      echo.delayTime.value = .018 + Math.abs(pan) * .013;
      stage.connect(echo).connect(echoGain);
    }
    const strike = start + Math.min(duration * .53, patch.a);
    const sustain = Math.max(strike + .014, start + duration);
    const end = sustain + patch.r;
    const amplitude = Math.max(EPSILON * 1.05, patch.level * strength);
    stage.gain.setValueAtTime(EPSILON, start);
    stage.gain.exponentialRampToValueAtTime(amplitude, strike);
    stage.gain.exponentialRampToValueAtTime(Math.max(EPSILON, amplitude * patch.e), sustain);
    stage.gain.exponentialRampToValueAtTime(EPSILON, end);

    let lfo, bend;
    if (patch.vibrato) {
      lfo = context.createOscillator();
      bend = gain(null, 0);
      lfo.frequency.value = name === "qin" ? 1.7 : 4.8;
      bend.gain.linearRampToValueAtTime(patch.vibrato, sustain);
      lfo.connect(bend);
      lfo.start(start);
      lfo.stop(end + .08);
    }
    let left = patch.partials.length;
    const fundamental = pitch(midi);
    patch.partials.forEach(([wave, ratio, level], index) => {
      const osc = context.createOscillator();
      const volume = gain(filter || stage, level);
      osc.type = wave;
      osc.frequency.setValueAtTime(fundamental * ratio, start);
      if (patch.fall) {
        osc.frequency.exponentialRampToValueAtTime(pitch(midi - patch.fall) * ratio, sustain);
      }
      if (name === "qin" && index > 0) {
        osc.detune.setValueAtTime(0, start);
        osc.detune.linearRampToValueAtTime(index === 2 ? -6.2 : 3.1, end);
      }
      if (bend) bend.connect(osc.detune);
      osc.connect(volume);
      osc.start(start);
      osc.stop(end + .035);
      osc.onended = () => {
        osc.disconnect();
        volume.disconnect();
        if (--left !== 0) return;
        stage.disconnect();
        filter?.disconnect();
        stereo?.disconnect();
        send?.disconnect();
        echo?.disconnect();
        echoGain?.disconnect();
        lfo?.disconnect();
        bend?.disconnect();
      };
    });
  }

  function air(destination, start, {duration = .4, from = 900, to = 230, type = "bandpass", level = .10, pan = 0, tail = .1, attack = .013, bump = 0} = {}) {
    const source = context.createBufferSource();
    const filter = context.createBiquadFilter();
    const envelope = gain(null, EPSILON);
    const stereo = panner(destination, pan);
    source.buffer = noise;
    filter.type = type;
    filter.Q.value = type === "lowpass" ? .52 : .82;
    filter.frequency.setValueAtTime(from, start);
    filter.frequency.exponentialRampToValueAtTime(to, start + duration);
    envelope.gain.setValueAtTime(EPSILON, start);
    envelope.gain.exponentialRampToValueAtTime(Math.max(EPSILON, level), start + attack);
    if (bump) {
      envelope.gain.exponentialRampToValueAtTime(level * .19, start + duration * .24);
      envelope.gain.exponentialRampToValueAtTime(level * bump, start + duration * .51);
    }
    envelope.gain.exponentialRampToValueAtTime(EPSILON, start + duration + tail);
    source.connect(filter).connect(envelope).connect(stereo || destination);
    source.start(start, Math.random() * Math.max(0, noise.duration - duration - tail - .12), duration + tail + .022);
    source.onended = () => {
      source.disconnect();
      filter.disconnect();
      envelope.disconnect();
      stereo?.disconnect();
    };
  }

  function thunder(start, strength = .65, destination = stormFoley) {
    if (start - lastThunder < 1.8) return;
    lastThunder = start;
    const side = centered() * .77;
    air(destination, start, {duration: 1.66, from: 1520, to: 72, type: "lowpass", level: .40 * strength, pan: side, bump: .51, tail: .66});
    air(destination, start + .21, {duration: 1.5, from: 530, to: 62, type: "lowpass", level: .205 * strength, pan: -side * .83, bump: .57, tail: .5});
    tone(destination, "drum", 35, start + .068, .32, .68 * strength, side * .18, .07);
  }

  function rain(destination, strength) {
    const source = context.createBufferSource();
    const edge = context.createBiquadFilter();
    const softness = context.createBiquadFilter();
    const blend = gain(destination, strength);
    source.buffer = noise;
    source.loop = true;
    edge.type = "highpass";
    edge.frequency.value = 420;
    softness.type = "lowpass";
    softness.frequency.value = 4300;
    source.connect(edge).connect(softness).connect(blend);
    source.start(context.currentTime, Math.random() * 2.8);
    source.onended = () => {
      source.disconnect();
      edge.disconnect();
      softness.disconnect();
      blend.disconnect();
    };
    return source;
  }

  function pattern(score, number) {
    const notes = [];
    const play = (channel, patch, midi, beat, duration, power, pan = 0, wet = score.wet) =>
      notes.push({channel, patch, midi, beat, duration, power, pan, wet});
    const strand = score.feel;
    for (const [beat, midi, duration, power] of score.phrases[number % score.phrases.length]) {
      play("lead", score.lead, midi, beat, duration, power, .08);
      if (strand === "fight" && beat % 2 === 0) play("harmony", "bow", midi - 12, beat + .027, duration * .87, power * .56, -.32, .16);
      if (strand === "flight" && beat >= 2) play("lead", "qin", midi + (midi > 76 ? -12 : 12), beat + .14, duration * .65, power * .58, -.44, .27);
    }
    score.chords[number % score.chords.length].forEach((chord, index) => {
      const start = index * 4;
      play("harmony", "bass", chord[0] - (strand === "fight" ? 12 : 0), start, strand === "fight" ? 2.8 : 3.4, strand === "fight" ? .78 : .43, 0, 0);
      chord.forEach((midi, voice) => {
        const moving = strand === "fight" || strand === "duet" || strand === "flight";
        play("harmony", moving ? "bow" : "drone", midi + (strand === "silk" ? 12 : 0), start + voice * .18,
          3.7 - voice * .17, moving ? .40 : .37, (voice - 1.3) * .29, moving ? .19 : .08);
      });
    });
    if (strand === "pulse" || strand === "ruin") {
      const starts = strand === "pulse" ? [0, 1, 2, 3, 4, 5, 6, 7] : [0, 2, 5, 7];
      for (const start of starts) {
        play("rhythm", "heart", 40, start, .085, .42 + (start % 4 === 0 ? .12 : 0), -.035, 0);
        play("rhythm", "heart", 37, start + .22, .079, .36, .042, 0);
      }
      play("detail", "metal", 71 + (number % 2 ? -6 : 0), 5.75, .5, .19, number % 2 ? -.51 : .47, .24);
    }
    if (strand === "fight") {
      for (const [beat, volume] of [[0, .84], [.75, .32], [1.5, .43], [2, .65], [3, .50], [3.75, .33], [4, .84], [4.75, .37], [5.5, .47], [6, .64], [6.75, .48], [7.5, .52]]) {
        play("rhythm", "drum", beat % 2 === 0 ? 45 : 50, beat, .12, volume, beat % 2 === 0 ? -.1 : .26, .07);
      }
      for (const beat of [1.75, 3.38, 5.75, 7.25]) {
        play("detail", "metal", 76 + (beat > 4 ? 3 : 0), beat, .055, .44, (beat - 4) * .17, .13);
        play("detail", "wood", 65, beat + .08, .042, .40, -(beat - 4) * .11, .12);
      }
    }
    if (strand === "silk" || strand === "duet" || strand === "flight") {
      const harmony = strand === "silk" ? [57, 64, 60, 67] : [60, 64, 67, 72];
      for (const [index, beat] of [1.15, 2.65, 4.85, 6.15].entries()) {
        play("detail", "qin", harmony[(index + number) % harmony.length], beat, 1.02, .30, -.42, .29);
      }
      for (const [index, beat] of [.16, 3.6, 7.46].entries()) {
        play("detail", "bell", [84, 91, 88][(index + number) % 3], beat, .24, strand === "silk" ? .25 : .16, (index - 1) * .44, .41);
      }
    }
    return notes.sort((first, second) => first.beat - second.beat);
  }

  function scaleChannels(layer, start) {
    const energy = [
      .64 + intensity * .46,
      .81 + intensity * .23,
      .38 + intensity * .79,
      .53 + intensity * .53,
      .88 - intensity * .15,
    ];
    layers.forEach((name, index) => fade(layer.channels[name].gain, layer.score.balance[index] * energy[index], start, .20));
  }

  function nextPhrase(layer, origin) {
    layer.origin = origin;
    layer.notes = pattern(layer.score, layer.phrase++);
    layer.cursor = 0;
  }

  function schedule() {
    if (!active || context.state !== "running") return;
    const layer = active;
    const beat = 60 / layer.score.bpm;
    const now = context.currentTime;
    const deadline = now + MOMENT;
    if (layer.synth && layer.origin + beat * 8 < now - .10) {
      const advanced = Math.floor((now - layer.origin) / (beat * 8));
      layer.phrase += Math.max(0, advanced - 1);
      nextPhrase(layer, layer.origin + advanced * beat * 8);
    }
    while (layer.synth && layer.origin < deadline) {
      const event = layer.notes[layer.cursor];
      if (!event) {
        if (layer.origin + beat * 8 >= deadline) break;
        nextPhrase(layer, layer.origin + beat * 8);
        continue;
      }
      const onset = layer.origin + event.beat * beat;
      if (onset > deadline) break;
      layer.cursor++;
      if (onset >= now - .20) {
        tone(layer.channels[event.channel], event.patch, event.midi, Math.max(now + .008, onset),
          event.duration * beat, event.power, event.pan, event.wet, layer.reverb);
      }
    }
    if (layer.thunder < deadline) {
      thunder(Math.max(now + .01, layer.thunder), .27 + intensity * .24, layer.channels.weather);
      layer.thunder = now + 8 + Math.random() * 10;
    }
  }

  function retire(layer, now) {
    fade(layer.bus.gain, 0, now, .22);
    fade(layer.ambience.gain, 0, now, .22);
    fade(layer.reverb.gain, 0, now, .29);
    layer.rain.stop(now + 1.08);
    retired.add(layer);
    layer.cleanup = window.setTimeout(() => {
      Object.values(layer.channels).forEach((channel) => channel.disconnect());
      layer.bus.disconnect();
      layer.ambience.disconnect();
      layer.reverb.disconnect();
      retired.delete(layer);
    }, 1400);
  }

  function enableSynth(layer, enabled) {
    if (!layer || layer.synth === enabled) return;
    layer.synth = enabled;
    const now = context.currentTime;
    fade(layer.bus.gain, enabled ? .95 : 0, now, .2);
    fade(layer.reverb.gain, enabled ? (voiceActive ? .48 : 1) : 0, now, .2);
    if (enabled) nextPhrase(layer, now + .047);
  }

  function reportEndingSong() {
    const ending = musicPlayer?.name === scene && !musicPlayer.loop ? musicPlayer : null;
    if (ending === reportedEnding) return;
    reportedEnding = ending;
    onEndingSong(ending?.name, ending?.audio);
  }

  function stopMusic(player) {
    if (!player) return;
    window.clearTimeout(player.timeout);
    player.audio.onerror = null;
    player.audio.pause();
    player.audio.removeAttribute("src");
    player.audio.load();
    player.node.disconnect();
    player.level.disconnect();
  }

  function discardSpare() {
    const previous = sparePlayer;
    sparePlayer = null;
    stopMusic(previous);
  }

  function fadeOutMusic(player) {
    if (!player) return;
    player.pending = false;
    player.timeout = window.setTimeout(() => {
      if (sparePlayer === player) discardSpare();
    }, MUSIC_TAIL_MS);
    fade(player.level.gain, 0, context.currentTime, MUSIC_FADE);
  }

  function fallBackToScore() {
    discardSpare();
    sparePlayer = musicPlayer;
    musicPlayer = null;
    reportEndingSong();
    fadeOutMusic(sparePlayer);
    enableSynth(active, true);
    schedule();
  }

  function keepOutgoing(player) {
    window.clearTimeout(player.timeout);
    const previous = musicPlayer;
    musicPlayer = player;
    sparePlayer = previous;
    player.pending = false;
    reportEndingSong();
    fade(player.level.gain, player.trim, context.currentTime, MUSIC_FADE);
    fadeOutMusic(previous);
    enableSynth(active, false);
  }

  function loadMusic(name) {
    const track = tracks.get(name);
    if (!track || typeof window.Audio !== "function") {
      fallBackToScore();
      return;
    }
    if (rejectedTracks.has(track.src) || performance.now() < (retryMusicAt.get(track.src) ?? 0)) {
      if (!musicPlayer) fallBackToScore();
      return;
    }
    if (musicPlayer?.src === track.src) {
      if (sparePlayer?.pending) discardSpare();
      musicPlayer.trim = track.trim;
      fade(musicPlayer.level.gain, track.trim, context.currentTime, .14);
      enableSynth(active, false);
      return;
    }
    if (sparePlayer?.src === track.src) {
      sparePlayer.trim = track.trim;
      if (!sparePlayer.pending) keepOutgoing(sparePlayer);
      return;
    }
    discardSpare();
    let player;
    function fail(error) {
      if (disposed || (sparePlayer !== player && musicPlayer !== player)) return;
      if (sparePlayer === player && !player.pending) {
        discardSpare();
        return;
      }
      if (error?.name === "NotAllowedError") {
        retryMusicAt.set(track.src, performance.now() + 700);
      } else {
        rejectedTracks.add(track.src);
      }
      if (musicPlayer === player) {
        stopMusic(player);
        musicPlayer = null;
        reportEndingSong();
      } else discardSpare();
      // A failed incoming file must not cut off a healthy current song.
      // A pending replacement can still begin over the temporary synth bed.
      if (!musicPlayer) {
        enableSynth(active, true);
        schedule();
      }
    }
    try {
      const audio = new window.Audio();
      audio.loop = track.loop;
      audio.preload = "auto";
      // URLs staged by the assembler are same-origin or embedded data URLs.
      // Cross-origin sources need CORS or WebAudio has to silence them.
      if (/^https?:/i.test(track.src) && new URL(track.src).origin !== location.origin) {
        audio.crossOrigin = "anonymous";
      }
      const node = context.createMediaElementSource(audio);
      const level = gain(musicBus, 0);
      node.connect(level);
      player = {name, audio, node, level, ...track, pending: true, timeout: 0};
      sparePlayer = player;
      audio.onerror = () => fail(audio.error);
      player.timeout = window.setTimeout(() => fail(), 4600);
      audio.src = track.src;
      Promise.resolve(audio.play()).then(() => {
        if (disposed || sparePlayer !== player || !player.pending) return;
        retryMusicAt.delete(track.src);
        keepOutgoing(player);
      }).catch(fail);
    } catch (error) {
      if (player) fail(error);
      else {
        rejectedTracks.add(track.src);
        if (!musicPlayer) fallBackToScore();
      }
    }
  }

  function activate(name) {
    if (active?.name === name) return;
    const now = context.currentTime;
    if (active) retire(active, now);
    const score = scores[name];
    const bus = gain(scoreBus, 0);
    const ambience = gain(weatherBus, 0);
    const reverb = gain(room, 0);
    fade(ambience.gain, .95, now, .18);
    const channels = {};
    for (const channel of layers) channels[channel] = gain(channel === "weather" ? ambience : bus, 0);
    active = {
      name, score, bus, ambience, reverb, channels, rain: rain(channels.weather, score.rain),
      synth: false, phrase: 0, thunder: score.feel === "pulse" ? now + 4 + Math.random() * 6 : Infinity,
    };
    scaleChannels(active, now);
    loadMusic(name);
    schedule();
  }

  function unlock() {
    if (!AudioEngine || disposed) return Promise.resolve(false);
    if (opening) return opening;
    if (context?.state === "running" && active) {
      if (!musicPlayer || musicPlayer.src !== tracks.get(scene)?.src) loadMusic(scene);
      return Promise.resolve(true);
    }
    try {
      if (!context) initialize();
      opening = context.resume().then(() => {
        if (disposed || context.state !== "running") return false;
        if (active?.name === scene) loadMusic(scene);
        else activate(scene);
        if (!timer) timer = window.setInterval(schedule, 110);
        return true;
      }).catch(() => false).finally(() => { opening = undefined; });
      return opening;
    } catch {
      return Promise.resolve(false);
    }
  }

  function setScene(name) {
    const target = aliases[name] || name;
    if (!Object.hasOwn(scores, target)) return;
    scene = target;
    reportEndingSong();
    if (!disposed && context?.state === "running") activate(scene);
  }

  function setIntensity(value) {
    intensity = clamp(value, intensity);
    if (active && !disposed) scaleChannels(active, context.currentTime);
  }

  function setLevel() {
    if (!master || disposed) return;
    fade(master.gain, muted ? 0 : volume * 1.22, context.currentTime, .065);
  }

  function setVolume(value) {
    volume = clamp(value, volume);
    setLevel();
  }

  function setMuted(value) {
    muted = Boolean(value);
    setLevel();
  }

  function setVoiceActive(value) {
    voiceActive = Boolean(value);
    if (!master || disposed) return;
    const now = context.currentTime;
    const attack = voiceActive ? .065 : .38;
    fade(musicBus.gain, MUSIC_TRIM * (voiceActive ? MUSIC_DUCK : 1), now, attack);
    fade(musicColor.gain, voiceActive ? MUSIC_DIALOGUE_EQ : 0, now, attack);
    fade(scoreBus.gain, voiceActive ? SYNTH_DUCK : 1, now, attack);
    fade(weatherBus.gain, voiceActive ? .31 : 1, now, attack);
    fade(stormFoley.gain, voiceActive ? .31 : .86, now, attack);
    fade(roomLevel.gain, voiceActive ? .11 : .25, now, attack);
    if (active?.synth) fade(active.reverb.gain, voiceActive ? .48 : 1, now, attack);
  }

  function cue(name, strength = .78) {
    if (disposed || muted || context?.state !== "running") return;
    const start = context.currentTime + .012;
    const weight = clamp(strength, .78);
    if (weight === 0) return;
    const play = (type, midi, offset, duration, power, pan = 0, wet = .14) =>
      tone(foley, type, midi, start + offset, duration, power * weight, pan, wet);
    const effect = (offset, settings) => air(foley, start + offset, {...settings, level: settings.level * weight});
    switch (name) {
      case "tick":
        play("wood", 74, 0, .036, .54, .06, .06);

const keyInsertDuration=570;
function actionInfo(target, now){
  const {kind,origin,progress,insertAt,beganAt}=target;
  const inserted=insertAt===null?0:Math.max(0,Math.min(1,(now-insertAt)/keyInsertDuration));
  const playing=beganAt!==null;
  const phase=playing?"playing":kind==="key"?(insertAt===null?"pick":"turn"):"ready";
  return {kind,origin,stage:phase,progress,inserted,ready:!playing&&(phase!=="turn"||inserted===1),
    elapsed:playing?Math.max(0,now-beganAt)/1000:0};
}
function charge(target,amount,now) {
  const previous=target.progress;
  target.progress=Math.min(1,previous+amount);
  if(Math.floor(target.progress*4)>Math.floor(previous*4))sound.cue("charge",target.progress);
  if(target.progress===1)beginAction(target,now);
}
function actionActivate(){
  if(!action)return;
  const now=performance.now();
  const info=actionInfo(action,now);
  if(!info.ready)return;
  readyAudio();
  if(info.stage==="pick"){
    action.insertAt=now;
    action.progress=.34;
    sound.cue("key",.52);
  }else if(info.kind==="sword")charge(action,.26,now);
  else beginAction(action,now);
}

    const point=positionInput(event);
    const plate=$("film-paint");
    plate.style.setProperty("--plate-x",(-point.x*4)+"px");
    plate.style.setProperty("--plate-y",(point.y*3)+"px");
  }
},{passive:true});
window.addEventListener("pointerup",trackedUp);
window.addEventListener("pointercancel",event=>{if(heldPointer?.id===event.pointerId)clearPointer();});
window.addEventListener("blur",clearPointer);
$("hotspot").addEventListener("click",event=>{if(event.detail===0)actionActivate();});
$("action-key").addEventListener("click",actionActivate);
function drawIdleProps(){
  const art=$("film-paint").dataset.art;
  const onPillar=hairpinLocation()==="pillar"&&art===(FALLBACK_ART[style]?.pillar??"pillar");
  propStage.render(teaSpilled?{kind:"tea-spill",progress:1}:onPillar?{kind:"pin-still",progress:1}:null,style);
}
function drawInteraction(ms){
  if(reaction){
    const progress=Math.max(0,Math.min(1,(ms-reaction.started)/reaction.duration));
    if(progress>=1){
      const next=reaction.finish;
      reaction=null;
      delete game.dataset.reaction;
      propStage.render(null,style);
      next();
    }else propStage.render({kind:"reaction",behavior:reaction.behavior,subject:reaction.subject,progress},style);
    return;
  }
  if(!action){drawIdleProps();return;}
  if(heldPointer&&action.kind==="sword"&&action.beganAt===null){
    charge(action,Math.max(0,ms-heldPointer.tick)/1060,ms);
    heldPointer.tick=ms;
  }
  const info=actionInfo(action,ms);
  const [impactAt,impactCue]=actionImpacts[info.kind];
  const delay=info.kind==="pin-bind"&&info.origin==="hair"?.18:0;
  if(!action.impact&&info.elapsed>=impactAt+delay){
    action.impact=true;
    sound.cue(impactCue,.72);
  }
  if(info.elapsed>=ACTION_LENGTH[info.kind]){
    finishAction(action);
    drawIdleProps();
    return;
  }
  if(info.kind==="hairpin"||info.kind==="tea"||info.kind==="pin-bind")setSceneBackdrop();
  propStage.render(info,style);
  const target=$("hotspot");
  const point=propStage.point();
  target.hidden=!info.ready;$("action-key").hidden=!info.ready;
  target.style.left=(point.x*100)+"%";target.style.top=(point.y*100)+"%";
  $("action-progress").value=info.progress;
  if(info.ready)$("action-hint").textContent=inputHints[info.stage==="turn"?"turn":info.kind];
  else if(info.kind==="key"&&info.stage==="turn")$("action-hint").textContent="铜钥入锁";
  else $("action-hint").textContent=info.kind.startsWith("pin-")?inputHints[info.kind]:
    {hairpin:"木簪刺向裴烬",tea:"杯盏落地",key:"柜门开启",sword:"锋芒已凝",resolve:"阵眼崩断"}[info.kind];
}
function frame(ms){
  film.animate(ms);
  drawInteraction(ms);
  if (!lookButton.hidden) {
    const disabled = !readyToLookAround();
    if (lookButton.disabled !== disabled) lookButton.disabled = disabled;
  }
  requestAnimationFrame(frame);
}
for(const b of topStyles)b.addEventListener("click",()=>selectStyle(b.dataset.style));
for(const b of editionButtons)b.addEventListener("click",()=>selectEdition(b.dataset.edition));
for(const b of document.querySelectorAll("[data-panel]"))b.addEventListener("click",()=>openPanel(b.dataset.panel));
$("home").addEventListener("click",returnHome);
$("start").addEventListener("click",startRun);
$("continue").addEventListener("click",()=>openRun(prefs.auto[edition]));
$("download").addEventListener("click",downloadArchive);
$("back").addEventListener("click",rewind);
$("sound").addEventListener("click",()=>setMute(!prefs.mute));
$("pocket").addEventListener("click",()=>openPanel("pocket"));
$("cinema").addEventListener("click",toggleFilm);
lookButton.addEventListener("click", () => { if (readyToLookAround()) lookAround.open(style, activeLookPlace()); });
$("close-panel").addEventListener("click",()=>modal.close());
$("full-text").addEventListener("click",()=>{
  dialogueExpanded=!dialogueExpanded;game.classList.toggle("full-script",dialogueExpanded);
  $("full-text").setAttribute("aria-pressed",String(dialogueExpanded));
  $("full-text").textContent=dialogueExpanded?"折叠剧本":"展开剧本";
});
window.addEventListener("keydown",event=>{
  if(modal.open||lookAround.isOpen()||event.repeat||event.ctrlKey||event.metaKey||event.isComposing)return;
  const k=event.key.toLowerCase();
  if(action&&k===" "){event.preventDefault();actionActivate();return;}
  if(waiting&&k===" "){event.preventDefault();$("continue-beat")?.click();return;}
  if(screen==="title")return;
  if(k==="backspace"){event.preventDefault();rewind();return;}
  if(k==="l"){openPanel("log");return;}
  if(k==="h"){toggleFilm();return;}
  if((k==="escape")&&game.classList.contains("view-only")){toggleFilm();return;}
  const i="abc".indexOf(k)>=0?"abc".indexOf(k):"123".indexOf(k);
  if(i>=0&&k.length===1){event.preventDefault();choose(i);}
});
sound.setMuted(prefs.mute);sound.setVolume?.(prefs.mix);sound.setScene("storm");
renderSound();renderMenu();requestAnimationFrame(frame);
</script>
</body>
</html>
